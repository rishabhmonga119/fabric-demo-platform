name: OIDC Fabric access check

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-test-access:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install declared verification dependencies
        run: python -m pip install azure-identity PyYAML
      - name: Authenticate with GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Verify configured SP can list Test items
        run: python tools/check_sp_access.py
